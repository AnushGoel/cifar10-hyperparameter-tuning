name: Bug report
description: Something in the notebook, scripts or dashboard does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The cell, command or dashboard page, and the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Colab T4, TensorFlow 2.19, Optuna 4.5, Streamlit 1.50"
